name: PR Quality Gate

on:
  pull_request:

jobs:
  smoke:
    name: API and UI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install UI dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Install Newman
        run: npm install -g newman

      - name: API smoke
        run: newman run tests/api/jsonplaceholder.postman_collection.json

      - name: UI login smoke
        run: pytest tests/ui/test_login.py -q

      - name: Save UI failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-ui-test-results
          path: test-results/
          if-no-files-found: ignore
